<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Web Ring</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Black+Ops+One&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── STARFIELD ── */
#starfield {
  position: fixed; inset: 0;
  z-index: 0; pointer-events: none;
}

/* ── PAGE WRAPPER ── */
.page {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 30px 20px 60px;
}

/* ── TOP LINKS ── */
.top-links {
  align-self: flex-end;
  margin-bottom: 14px;
  font-size: 12px;
}
.top-links a {
  color: #bb8800;
  text-decoration: underline;
  margin-left: 16px;
}
.top-links a:hover { color: #ffcc00; }


/* ─────────────────────────────────────────
   NEON TEXT HELPERS
   Crisp white core → tight neon colour → soft outer bloom
   ───────────────────────────────────────── */
.neon-orange {
  color: #fff8f0;
  text-shadow:
    0 0 2px  #fff,
    0 0 6px  #ffcc44,
    0 0 18px #ff8800,
    0 0 38px rgba(255,100,0,0.45);
}
.neon-pink {
  color: #fff0f8;
  text-shadow:
    0 0 2px  #fff,
    0 0 6px  #ff88ee,
    0 0 18px #ff00bb,
    0 0 38px rgba(200,0,150,0.45);
}
.neon-cyan {
  color: #f0ffff;
  text-shadow:
    0 0 2px  #fff,
    0 0 6px  #88eeff,
    0 0 18px #00ccee,
    0 0 38px rgba(0,160,220,0.45);
}
.neon-yellow {
  color: #fffff0;
  text-shadow:
    0 0 2px  #fff,
    0 0 6px  #ffff88,
    0 0 18px #dddd00,
    0 0 38px rgba(180,180,0,0.45);
}

/* ─────────────────────────────────────────
   NEON SIGN CARDS
   ───────────────────────────────────────── */
.signs-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: 48px;
  margin: 24px 0 48px;
}

.neon-sign {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  text-decoration: none;
  padding: 32px 40px;
  border-radius: 12px;
  cursor: pointer;
  transition: filter 0.2s;
  position: relative;
  min-width: 240px;
  background: rgba(0,0,0,0.55);
}
.neon-sign:hover { filter: brightness(1.18); }

/* Neon border glow — color set per sign */
.neon-sign-orange {
  border: 2px solid #ff8800;
  box-shadow: 0 0 8px #ff8800, 0 0 20px #ff6600,
              inset 0 0 12px rgba(255,120,0,0.08);
}
.neon-sign-pink {
  border: 2px solid #ff00bb;
  box-shadow: 0 0 8px #ff00bb, 0 0 20px #cc0099,
              inset 0 0 12px rgba(255,0,180,0.08);
}
.neon-sign-cyan {
  border: 2px solid #00ccee;
  box-shadow: 0 0 8px #00ccee, 0 0 20px #0088cc,
              inset 0 0 12px rgba(0,200,255,0.08);
}

/* Site number badge */
.sign-num {
  position: absolute;
  top: -12px; left: 50%;
  transform: translateX(-50%);
  background: #000;
  padding: 0 10px;
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: bold;
}

/* Site label above the name */
.sign-label {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0.7;
  margin-bottom: 10px;
  font-family: Arial, sans-serif;
}

/* Main site name — big neon script */
.sign-name {
  font-family: 'Pacifico', cursive;
  font-size: 44px;
  line-height: 1.2;
}

/* Smaller descriptor below */
.sign-desc {
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: #888;
  margin-top: 12px;
  letter-spacing: 1px;
  max-width: 200px;
}

/* ─────────────────────────────────────────
   MAIN TITLE
   ───────────────────────────────────────── */
.ring-title-wrap {
  text-align: center;
  margin-bottom: 32px;
}
.ring-title {
  font-family: 'Black Ops One', Arial Black, sans-serif;
  font-size: 80px;
  letter-spacing: 4px;
  line-height: 1;
}
.ring-sub {
  font-family: 'Pacifico', cursive;
  font-size: 22px;
  margin-top: 8px;
  opacity: 0.8;
}
.ring-byline {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #446688;
  margin-top: 10px;
}

/* ─────────────────────────────────────────
   RING NAVIGATION
   ───────────────────────────────────────── */
.ring-nav {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-bottom: 36px;
  flex-wrap: wrap;
  justify-content: center;
}
.ring-nav-label {
  font-family: 'Black Ops One', sans-serif;
  font-size: 14px;
  letter-spacing: 3px;
}
.nav-btn {
  display: inline-block;
  font-family: Arial, sans-serif;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  text-decoration: none;
  padding: 8px 20px;
  border-radius: 4px;
  border: 2px solid #00ccee;
  transition: filter 0.15s;
}
.nav-btn:hover { filter: brightness(1.3); }

/* ── GUESTBOOK / FOOTER LINKS ── */
.footer-links {
  color: #334455;
  font-size: 12px;
  text-align: center;
  margin-top: 8px;
  line-height: 2.2;
}
.footer-links a { color: #336699; text-decoration: none; margin: 0 8px; }
.footer-links a:hover { color: #aaccff; text-decoration: underline; }

.awards {
  color: #334455;
  font-size: 11px;
  text-align: center;
  margin-top: 36px;
  line-height: 2;
}

/* ── MOBILE ── */
@media (max-width: 600px) {
  .page { padding: 20px 12px 40px; }
  .ring-title { font-size: 54px; letter-spacing: 2px; }
  .ring-sub { font-size: 17px; }
  .signs-row { gap: 28px; margin: 16px 0 32px; }
  .neon-sign { min-width: 0; width: min(90vw, 320px); padding: 24px 20px; }
  .sign-name { font-size: 34px; }
  .ring-nav { gap: 14px; }
  .top-links { align-self: center; }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="page">

  <!-- Top links -->
  <div class="top-links">
    <a href="../index.html">Text Version</a>
    <a href="../guestbook.html">Sign Guestbook</a>
  </div>

  <!-- Main title -->
  <div class="ring-title-wrap">
    <div class="ring-title">
      <span class="neon-orange">WEB</span>&nbsp;<span class="neon-pink">RING</span>
    </div>
    <div class="ring-sub neon-cyan">Est. 2026</div>
    <div class="ring-byline">Click any site below to explore</div>
  </div>

  <!-- Neon signs -->
  <div class="signs-row">

    <!-- Site 01 — Ento-Professo -->
    <a class="neon-sign neon-sign-orange" href="../index.html">
      <div class="sign-num neon-orange">SITE 01</div>
      <div class="sign-name neon-orange">Ento-Professo</div>
    </a>

    <!-- Site 02 — GradHunt -->
    <a class="neon-sign neon-sign-pink" href="../school-finder/index.html">
      <div class="sign-num neon-pink">SITE 02</div>
      <div class="sign-name neon-pink">GradHunt</div>
      <div class="sign-name neon-yellow" style="font-size:28px; margin-top:-6px;">20/20</div>
    </a>

  </div>

  <!-- Ring navigation -->
  <div class="ring-nav">
    <a class="nav-btn neon-cyan" href="../index.html">&#9668;&#9668; Previous</a>
    <div class="ring-nav-label neon-cyan">&#9733;&nbsp;WEB RING&nbsp;&#9733;</div>
    <a class="nav-btn neon-cyan" href="../school-finder/index.html">Next &#9658;&#9658;</a>
  </div>

  <!-- Footer links -->
  <div class="footer-links">
    <a href="../guestbook.html">Sign the Guestbook</a>
    <a href="../index.html">Ento-Professo</a>
    <a href="../school-finder/index.html">GradHunt 20/20</a>
  </div>

  <div class="awards">
    2026 &mdash; Hey, it Works<br>
    <span style="font-size:10px;">{click for magazine quotes}</span>
  </div>

</div>

<script>
// ── STARFIELD ──
const canvas = document.getElementById("starfield");
const ctx    = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = Math.max(document.body.scrollHeight, window.innerHeight);
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const count = Math.floor((canvas.width * canvas.height) / 4000);
  for (let i = 0; i < count; i++) {
    const x    = Math.random() * canvas.width;
    const y    = Math.random() * canvas.height;
    const r    = Math.random() * 1.4 + 0.2;
    const glow = Math.random() > 0.93;
    const a    = glow ? 1.0 : 0.3 + Math.random() * 0.6;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = glow ? `rgba(180,210,255,${a})` : `rgba(255,255,255,${a})`;
    ctx.fill();
    if (glow) {
      ctx.beginPath();
      ctx.arc(x, y, r * 3, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(150,180,255,0.06)";
      ctx.fill();
    }
  }
}

resizeCanvas();
drawStars();
window.addEventListener("resize", () => { resizeCanvas(); drawStars(); });
</script>

</body>
</html>
